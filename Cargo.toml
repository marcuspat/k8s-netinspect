[package]
name = "k8s-netinspect"
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
authors = ["Marcus Patman"]
description = "Kubernetes network diagnostics: CNI, NetworkPolicy reachability, Services, DNS, Ingress and Gateway API"
homepage = "https://github.com/marcuspat/k8s-netinspect"
documentation = "https://github.com/marcuspat/k8s-netinspect"
repository = "https://github.com/marcuspat/k8s-netinspect"
readme = "README.md"
license = "MIT"
keywords = ["kubernetes", "networking", "cni", "diagnostics", "k8s"]
categories = ["command-line-utilities", "network-programming"]
exclude = [
    "scripts/",
    "tests/fixtures/",
    "test-resources.yaml",
    "docs/",
    "demo/",
    "*.gif",
    ".swarm/",
    ".claude/",
    ".roo/",
    ".roomodes",
]

[lib]
name = "k8s_netinspect"
path = "src/lib.rs"

[[bin]]
name = "k8s-netinspect"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
colored = "3"
k8s-openapi = { version = "0.28", features = ["latest"] }
kube = { version = "4.2", features = ["client"] }
regex = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
